<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha conta | Folha Viva</title>
    <meta name="theme-color" content="#0c0c0e">
    <link rel="icon" type="image/svg+xml" href="../imagens/logo-icone.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/loja.css">

    <script src="../js/comum.js" defer></script>
    <script src="../js/visual.js" defer></script>
    <script src="../js/perfil.js" defer></script>
</head>

<body data-requer-login>

    <header class="topo">

        <a href="../index.html" class="logo" aria-label="Folha Viva — início">
            <span class="logo-marca" data-icone="marca"></span>
            <span class="logo-texto">
                <strong>Folha Viva</strong>
                <small>Livraria</small>
            </span>
        </a>

        <nav class="menu">
            <a href="../index.html" class="menu-texto">Início</a>
            <a href="produto/produtos.html" class="menu-texto">Produtos</a>

            <span class="menu-separador" aria-hidden="true"></span>

            <a href="carrinho.html" class="menu-icone menu-carrinho" data-rotulo="Carrinho" aria-label="Carrinho">
                <i class="icone" data-icone="carrinho"></i>
                <span class="selo" data-selo-carrinho hidden>0</span>
                <span class="sr">Carrinho</span>
            </a>
            <a href="historico.html" class="menu-icone" data-rotulo="Pedidos" aria-label="Pedidos">
                <i class="icone" data-icone="pedidos"></i>
                <span class="sr">Pedidos</span>
            </a>
            <a href="perfil.html" class="menu-icone ativo" data-rotulo="Minha conta" aria-label="Minha conta">
                <i class="icone" data-icone="conta"></i>
                <span class="sr">Minha conta</span>
            </a>
            <a href="login.html" class="menu-icone" data-rotulo="Sair" data-so-logado aria-label="Sair">
                <i class="icone" data-icone="sair"></i>
                <span class="sr">Sair</span>
            </a>
        </nav>

        <a href="admin.html" class="admin-link"><i class="icone" data-icone="admin"></i><span>Área administrativa</span></a>
    </header>

    <main class="pagina-perfil">

        <h1>Minha conta</h1>
        <p>Suas informações pessoais e endereço.</p>

        <form id="formPerfil">

            <h2>Dados pessoais</h2>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>

            <label for="sobreNome">Sobrenome:</label>
            <input type="text" id="sobreNome" required>

            <label for="idade">Idade:</label>
            <input type="text" id="idade" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" required>

            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" required>

            <h2>Endereço</h2>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" required>

            <label for="rua">Rua:</label>
            <input type="text" id="rua" required>

            <label for="numero">Número:</label>
            <input type="text" id="numero" required>

            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" required>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" required>

            <label for="estado">Estado:</label>
            <input type="text" id="estado" maxlength="2" required>

            <button type="submit">Salvar alterações</button>

        </form>

    </main>

    <footer>
        <div class="rodape-marca">
            <span class="logo-marca" data-icone="marca"></span>
            <strong>Folha Viva</strong>
        </div>
        <p>Sua livraria de livros físicos e e-books.</p>
        <p>Desenvolvido por Gabriela Rankel</p>

        <a href="https://github.com/GabrielaRankel/ecomerce"
           target="_blank"
           rel="noopener noreferrer"
           class="github-link">
            <i class="icone" data-icone="github"></i>
            <span>GitHub</span>
        </a>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso administrativo | Folha Viva</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/contas.css">

    <script src="../js/comum.js" defer></script>
    <script src="../js/admin_login.js" defer></script>
</head>

<body>

    <header class="topo">
        <a href="../index.html" class="logo">
            <span class="logo-livro">📖</span>
            <span>Folha Viva</span>
        </a>

        <nav class="menu">
            <a href="../index.html">Início</a>
            <a href="produto/produtos.html">Produtos</a>
            <a href="login.html">Minha conta</a>
        </nav>
    </header>

    <main class="pagina-login">

        <h1>Acesso administrativo</h1>
        <p>Área exclusiva para a equipe da Folha Viva.</p>

        <form id="formLoginAdmin">

            <h2>Entrar como administrador 🔑</h2>

            <label for="email">E-mail:</label>
            <input type="email" id="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" required>

            <button type="submit">Entrar</button>

            <p id="mensagem" class="cadastro-link"></p>

            <p class="cadastro-link">
                É cliente? <a href="login.html">Entre por aqui</a>
            </p>

        </form>

    </main>

    <footer>
        <h2>📖 Folha Viva</h2>
        <p>Sua livraria de livros físicos e e-books.</p>
    </footer>

</body>
</html>
